    --nyc-light: #e8f0f9;
    --vegas: #5c1a3a;
    --vegas-light: #f9e8f0;
    --gold: #f0a500;
    --green: #2ecc71;
    --text: #1a1a2e;
    --muted: #666;
    --bg: #f5f5f0;
    --white: #ffffff;
    --radius: 16px;
    --shadow: 0 4px 20px rgba(0,0,0,0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* HEADER */

    padding: 24px 20px 20px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .header .dates { font-size: 13px; opacity: 0.7; margin-top: 6px; position: relative; }
  .map-btn-header {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,0.2); color: white;
    text-decoration: none; padding: 8px 18px; border-radius: 50px;
    font-size: 14px; font-weight: 700; margin-top: 14px;
    position: relative; transition: background 0.2s;
    border: 1px solid rgba(255,255,255,0.35);
  }
  .map-btn-header:hover { background: rgba(255,255,255,0.3); }

  /* NAV TABS */
  .nav-tabs {
    display: flex;
    background: white;
    border-bottom: 1px solid #e0e0e0;
    overflow-x: auto;
    scrollbar-width: none;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .nav-tabs::-webkit-scrollbar { display: none; }
  .tab-btn {
    flex: none;
    padding: 12px 16px;
    border: none;
    background: none;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    white-space: nowrap;
    transition: all 0.2s;
    border-bottom: 3px solid transparent;
    font-family: inherit;
  }
  .tab-btn:hover { color: var(--text); background: #f5f5f5; }
  .tab-btn.active { color: var(--nyc); border-bottom-color: var(--nyc); }
  .tab-btn.vegas-tab.active { color: var(--vegas); border-bottom-color: var(--vegas); }
  .tab-btn.today-badge::after {
    content: '●';
    color: var(--green);
    font-size: 8px;
    margin-right: 4px;
    vertical-align: super;
  }

  /* MAIN */
  .main { max-width: 700px; margin: 0 auto; padding: 20px 16px 80px; }

  /* SECTION */
  .section { display: none; }
  .section.active { display: block; }

  /* TODAY BANNER */
  .today-banner {
    background: linear-gradient(135deg, #1a3a5c, #2563a8);
    color: white;
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 20px;
    text-align: center;
  }
  .today-banner.vegas { background: linear-gradient(135deg, #5c1a3a, #a8254e); }
  .today-banner h2 { font-size: 22px; font-weight: 800; }
  .today-banner p { font-size: 14px; opacity: 0.85; margin-top: 4px; }

  /* DAY CARD */
  .day-card {
    background: white;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    margin-bottom: 16px;
    overflow: hidden;
  }
  .day-header {
    padding: 16px 20px 12px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    border-bottom: 1px solid #f0f0f0;
  }
  .day-header.nyc { border-right: 5px solid var(--nyc); }
  .day-header.vegas { border-right: 5px solid var(--vegas); }
  .day-header.philly { border-right: 5px solid #3a7c1a; }
  .day-header.travel { border-right: 5px solid var(--gold); }
  .day-date { font-size: 13px; color: var(--muted); }
  .day-title { font-size: 17px; font-weight: 700; flex: 1; }
  .day-city {
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 20px;
    font-weight: 600;
  }
  .city-nyc { background: var(--nyc-light); color: var(--nyc); }
  .city-vegas { background: var(--vegas-light); color: var(--vegas); }
  .city-philly { background: #e8f5e0; color: #2a6010; }
  .city-travel { background: #fff8e0; color: #8a5a00; }
  .day-toggle { font-size: 18px; color: var(--muted); transition: transform 0.3s; }
  .day-card.open .day-toggle { transform: rotate(180deg); }

  .day-body { display: none; padding: 8px 0 12px; }
  .day-card.open .day-body { display: block; }

  /* TIMELINE */
  .timeline { position: relative; padding: 0 20px; }
  .tl-item {
    display: flex;
    gap: 14px;
    padding: 10px 0;
    position: relative;
  }
  .tl-item::before {
    content: '';
    position: absolute;
    right: 30px;
    top: 28px;
    bottom: -10px;
    width: 2px;
    background: #f0f0f0;
  }
  .tl-item:last-child::before { display: none; }
  .tl-time {
    min-width: 52px;
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    text-align: left;
    direction: ltr;
    padding-top: 2px;
  }
  .tl-dot {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
    z-index: 1;
  }
  .dot-game { background: #fff3cd; }
  .dot-food { background: #d4edda; }
  .dot-party { background: #f8d7da; }
  .dot-move { background: #d1ecf1; }
  .dot-explore { background: #e2d9f3; }
  .dot-sleep { background: #f0f0f0; }
  .tl-content { flex: 1; }
  .tl-title { font-size: 15px; font-weight: 600; line-height: 1.3; }
  .tl-note { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .tl-map-btn {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; color: #1a73e8; text-decoration: none;
    margin-top: 5px; font-weight: 600;

  .tl-tag {
    display: inline-block;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    margin-top: 4px;
    font-weight: 600;

  .tag-party { background: #f8d7da; color: #842029; }
  .tag-must { background: #cfe2ff; color: #084298; }

    gap: 14px;
    align-items: center;

  .w-vegas { background: var(--vegas); }
  .w-philly { background: #3a7c1a; }
  .w-travel { background: var(--gold); }

  .week-date { font-size: 12px; color: var(--muted); }
  .week-title { font-size: 15px; font-weight: 600; }
  .week-highlights { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .today-badge-text {
    font-size: 11px; font-weight: 700; color: var(--green);

    border-radius: 12px;

    align-items: center;
    gap: 12px;

  .attr-name { font-size: 15px; font-weight: 600; flex: 1; }
  .attr-type { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .attr-check {
    width: 24px; height: 24px; border-radius: 50%;
    border: 2px solid #ddd; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; transition: all 0.2s;
  }
  .attr-check.done { background: var(--green); border-color: var(--green); color: white; }

  /* FLOATING TODAY BTN */
  .fab {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: linear-gradient(135deg, #1a3a5c, #5c1a3a);
    color: white;
    border: none;
    padding: 14px 28px;
    border-radius: 50px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;

    font-family: inherit;
    transition: transform 0.2s;
  }
  .fab:hover { transform: translateX(-50%) scale(1.05); }

    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }
  .empty-state .big { font-size: 60px; margin-bottom: 16px; }
  .empty-state h3 { font-size: 20px; font-weight: 700; color: var(--text); }
  .empty-state p { font-size: 14px; margin-top: 8px; }
</style>
</head>

// --- UTILS ---
function getTodayDate() {
  const now = new Date();
  return now.toISOString().split('T')[0];
}

function getDayByDate(date) {
  return DAYS.find(d => d.date === date);
}

function showSection(id) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('section-' + id).classList.add('active');
  document.getElementById('tab-' + id).classList.add('active');
}

function renderTodayContent() {
  const today = getTodayDate();
  const day = getDayByDate(today);
  const container = document.getElementById('today-content');

  if (!day) {
    // Check if trip hasn't started or has ended
    const start = '2026-06-12';
    const end = '2026-06-22';
    if (today < start) {
      const days = Math.ceil((new Date(start) - new Date(today)) / 86400000);
      container.innerHTML = `
        <div class="empty-state">
          <div class="big">✈️</div>
          <h3>הטיול מתחיל בעוד ${days} ימים!</h3>
          <p>12 יוני 2026 – ניו יורק מחכה לנו</p>
        </div>`;
    } else {
      container.innerHTML = `
        <div class="empty-state">
          <div class="big">🏠</div>
          <h3>הטיול הסתיים</h3>
          <p>איזה כיף היה! 🎉</p>
        </div>`;
    }
    return;
  }

  const isVegas = day.city === 'vegas' || day.city === 'travel' && day.date >= '2026-06-17';
  const bannerClass = (day.city === 'vegas') ? 'today-banner vegas' : 'today-banner';

  let html = `
    <div class="${bannerClass}">
      <h2>${day.title}</h2>
      <p>${day.display} • ${day.cityLabel}</p>
    </div>
    <div class="day-card open" style="margin-bottom:0">
      <div class="day-body" style="display:block">
        ${renderTimeline(day.items)}
      </div>
    </div>`;
  container.innerHTML = html;
}

function renderTimeline(items) {
  return `<div class="timeline">${items.map(item => {
    const mapUrl = item.mapUrl || (item.map
      ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.map)}`
      : null);
    return `
    <div class="tl-item">
      <div class="tl-time">${item.time || ''}</div>
      <div class="tl-dot dot-${item.dot}">${item.icon}</div>
      <div class="tl-content">
        <div class="tl-title">${item.title}</div>
        ${item.note ? `<div class="tl-note">${item.note}</div>` : ''}
        <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;">
          ${item.tag ? `<span class="tl-tag tag-${item.tag}">${item.tagLabel}</span>` : ''}
          ${mapUrl ? `<a class="tl-map-btn" href="${mapUrl}" target="_blank">📍 ${item.pin ? '#'+item.pin+' ' : ''}מפה</a>` : ''}
        </div>
      </div>
    </div>`;
  }).join('')}</div>`;
}

function renderWeek() {
  const today = getTodayDate();
  const grid = document.getElementById('week-grid');
  grid.innerHTML = DAYS.map((day, i) => {
    const isToday = day.date === today;
    const colorClass = day.city === 'vegas' ? 'w-vegas' : day.city === 'nyc' ? 'w-nyc' : day.city === 'philly' ? 'w-philly' : 'w-travel';
    return `
      <div class="week-item${isToday ? ' is-today' : ''}" onclick="openDayModal(${i})">
        <div class="week-dot ${colorClass}"></div>
        <div class="week-info">
          <div class="week-date">${day.display} • ${day.cityLabel}</div>
          <div class="week-title">${day.title}</div>
          <div class="week-highlights">${day.highlights}</div>
        </div>
        ${isToday ? '<div class="today-badge-text">היום</div>' : '<div style="color:#ccc;font-size:18px;">›</div>'}
      </div>`;
  }).join('');
}

let modalDay = null;
function openDayModal(idx) {
  const day = DAYS[idx];
  // Build an inline expanded card below
  const existing = document.getElementById('modal-overlay');
  if (existing) existing.remove();

  const overlay = document.createElement('div');
  overlay.id = 'modal-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;display:flex;align-items:flex-end;';
  const isVegas = day.city === 'vegas';
  overlay.innerHTML = `
    <div style="background:white;width:100%;max-height:85vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:20px;">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">
        <div style="flex:1">
          <div style="font-size:13px;color:#888;">${day.display} • ${day.cityLabel}</div>
          <div style="font-size:20px;font-weight:800;">${day.title}</div>
        </div>
        <button onclick="document.getElementById('modal-overlay').remove()" style="border:none;background:#f0f0f0;width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer;">✕</button>
      </div>
      ${renderTimeline(day.items)}
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
}

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const attDoc = db.collection('trip').doc('attractions');

let attrState = {};

function renderAttractions() {
  function renderList(items, containerId, prefix) {
    const container = document.getElementById(containerId);
    if (!container) return;
    container.innerHTML = items.map((item, i) => {
      const key = prefix + i;
      const done = attrState[key];
      return `
        <div class="attr-item">
          <div class="attr-icon">${item.icon}</div>
          <div style="flex:1">
            <div class="attr-name">${item.name}</div>
            <div class="attr-type">${item.type}</div>
          </div>
          <div class="attr-check${done ? ' done' : ''}" onclick="toggleAttr('${key}', this)">${done ? '✓' : ''}</div>
        </div>`;
    }).join('');
  }
  renderList(NYC_ATTRACTIONS, 'attr-nyc', 'nyc_');
  renderList(VEGAS_ATTRACTIONS, 'attr-vegas', 'vegas_');
}

function toggleAttr(key, el) {
  const isDone = !attrState[key];
  attrState[key] = isDone;
  el.classList.toggle('done', isDone);
  el.textContent = isDone ? '✓' : '';
  attDoc.set({ [key]: isDone }, { merge: true });
}

// Real-time listener — updates all friends instantly
attDoc.onSnapshot(doc => {
  attrState = doc.exists ? doc.data() : {};
  renderAttractions();
}, err => {
  console.warn('Firebase error, falling back to local', err);
  renderAttractions();
});

// Mark today's tab
function markTodayTab() {
  const today = getTodayDate();
  const day = getDayByDate(today);
  if (day) {
    document.getElementById('tab-today').classList.add('today-badge');
    if (day.city === 'vegas') {
      document.getElementById('tab-today').classList.add('vegas-tab');
    }
  }
}
